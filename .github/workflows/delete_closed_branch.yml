name: Delete closed branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete:
    # Merged branches are removed by the repository setting; this covers PRs closed without merging.
    if: github.event.pull_request.merged == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${{ github.event.pull_request.head.ref }}"
        env:
          GH_TOKEN: ${{ github.token }}

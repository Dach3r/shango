#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  purge_orphaned_blobs:
    class: PurgeOrphanedBlobsJob
    schedule: every day at 3am
  prune_request_executions:
    class: PruneRequestExecutionsJob
    schedule: every day at 3:30am
  prune_network_checks:
    class: PruneNetworkChecksJob
    schedule: every day at 3:45am
  prune_request_drafts:
    class: PruneRequestDraftsJob
    schedule: every day at 4am
  prune_collection_exports:
    class: PruneCollectionExportsJob
    schedule: every hour at minute 20
  prune_collection_runs:
    class: PruneCollectionRunsJob
    schedule: every day at 4:15am
  monitoring_dispatch:
    class: MonitoringDispatchJob
    schedule: every minute
  prune_monitoring:
    class: PruneMonitoringJob
    schedule: every hour at minute 40

development:
  monitoring_dispatch:
    class: MonitoringDispatchJob
    schedule: every minute

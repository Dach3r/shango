        pre:
          title: Skript vor der Anfrage
          hint: Läuft, bevor die Anfrage erstellt wird. Ändere Variablen mit pm.environment.set() oder die Anfrage mit pm.request.
        post:
          title: Skript nach der Antwort
          hint: Läuft, nachdem die Antwort eingetroffen ist. Schreibe Tests mit pm.test() und pm.expect() und speichere Werte mit pm.environment.set().
        reference: JavaScript mit der pm-API (eine Teilmenge der von Postman). Kein Netzwerk, keine Dateien; jedes Skript wird nach wenigen Sekunden beendet.
      console:
        title: Konsole
        empty: Die Skripte haben nichts in die Konsole geschrieben.
      inherited:
        title: Tests für jede Anfrage darunter
        hint: Assertions und Extraktoren hier laufen in dieser Reihenfolge vor denen der Anfrage selbst, für jede Anfrage darin.
      assertions:
        title: Assertions
        hint: Jede aktive Assertion wird gegen jede Antwort geprüft. Im erwarteten Wert funktionieren {{variables}}.
        add: Assertion hinzufügen
      extractors:
        title: Extraktoren
        hint: Kopiert einen Wert aus der Antwort in eine Umgebungsvariable, damit die nächste Anfrage ihn verwenden kann.
        add: Extraktor hinzufügen
      extractor_title: "%{variable} aus %{from} setzen"
      extractor_unsaved: Extrahierte Werte wurden nicht in der Umgebung gespeichert
      actual: 'Erhalten: %{value}'

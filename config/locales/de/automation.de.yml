        matches: entspricht
        type: hat den Typ
        length: hat die Länge
        is_empty: ist leer
      errors:
        unsupported: Diese Prüfung wird nicht unterstützt.
        invalid_expected: Der erwartete Wert ist für diese Prüfung ungültig.
        invalid_json: Der Antwort-Body ist kein gültiges JSON.
        invalid_path: Der JSONPath ist ungültig.
        invalid_pattern: Das Muster ist kein gültiger regulärer Ausdruck.
        pattern_timeout: Das Muster hat zu lange gebraucht.
        not_found: An diesem Pfad wurde nichts gefunden.

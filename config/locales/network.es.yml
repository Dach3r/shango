    statuses:
      ok: Respondió
      cname: Alias
      nodata: Sin registros
      nxdomain: No existe
      servfail: Fallo del servidor
      refused: Rechazado
      timeout: Tiempo agotado
      error: Error
      blocked: Bloqueado
      unresolved: Sin dirección
      match: Coincide
      mismatch: Difiere
      no_answer: Sin respuesta
      open: Abierto
      closed: Cerrado
      filtered: Filtrado
    dns:
      intro: Consulta resolvers públicos y los nameservers autoritativos del dominio por un registro, para ver si un cambio de DNS ya se propagó.
      domain: Dominio
      domain_placeholder: example.com o {{host}}
      type: Tipo
      expected: Valor esperado
      expected_placeholder: 203.0.113.10
      expected_hint: Opcional. Cada resolver se marca como coincidente o no, para ver hasta dónde llegó el cambio.
      submit: Comprobar DNS
      no_authoritative: No se pudieron determinar los nameservers autoritativos de este dominio.
      summary:
        expected: "%{matched} de %{total} resolvers coinciden con el valor esperado"
        answered: "%{answered} de %{total} resolvers respondieron"
        agree: Todas las respuestas coinciden.
        differ: Las respuestas difieren entre resolvers, por lo que el cambio puede seguir propagándose.
      groups:
        authoritative: Nameservers autoritativos
        public: Resolvers públicos
      columns:
        resolver: Resolver
        answer: Respuesta
        ttl: TTL
        latency: Latencia
        status: Estado
    ports:
      intro: Comprueba qué puertos TCP responden en un host desde el servidor de Shango, por ejemplo tras cambiar un firewall o desplegar un servicio.
      host: Host
      host_placeholder: example.com, 203.0.113.10 o {{host}}
      ports: Puertos
      ports_placeholder: 22, 80, 443 o 8000-8010
      ports_hint: "Números, rangos y common, separados por comas. Máximo %{max} puertos."
      submit: Comprobar puertos
      summary: "%{open} abiertos, %{closed} cerrados, %{filtered} filtrados"
      all_filtered: Nada respondió. Un firewall puede estar descartando los paquetes, o el host puede estar apagado.
      columns:
        port: Puerto
        service: Servicio habitual
        latency: Latencia
        status: Estado

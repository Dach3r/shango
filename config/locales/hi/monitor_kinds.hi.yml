hi:
  activerecord:
    errors:
      models:
        uptime_monitor:
          attributes:
            base:
              push_token: "पुश मॉनिटर को उसका गुप्त टोकन चाहिए।"
    attributes:
      uptime_monitor:
        expires_at: "समाप्ति"
        last_pinged_at: "पिछला पिंग"
  monitoring:
    kind_hints:
      http: "एक URL का अनुरोध करता है और स्टेटस व प्रतिक्रिया समय जाँचता है।"
      tcp: "किसी होस्ट और पोर्ट से TCP कनेक्शन खोलता है और तुरंत बंद कर देता है।"
      ssl: "किसी होस्ट का TLS प्रमाणपत्र जाँचता है: भरोसेमंद, नाम के लिए मान्य और जल्द समाप्त न होने वाला।"
      domain: "RDAP के ज़रिए जाँचता है कि डोमेन का पंजीकरण कब समाप्त होता है।"
      push: "आपके जॉब, क्रॉन या बैकअप के एक गुप्त URL को कॉल करने का इंतज़ार करता है; कॉल न आने पर डाउन।"
    new:
      choose: "चुनें कि क्या मॉनिटर करना है।"
    form:
      host_placeholder: "example.com या {{host}}"
      host_hint: "होस्ट नाम या IP पता। वेरिएबल नीचे चुने गए एनवायरनमेंट से आते हैं; गुप्त वेरिएबल का उपयोग नहीं किया जा सकता।"
      ssl_hint: "जब प्रमाणपत्र भरोसेमंद न हो, होस्ट के लिए मान्य न हो, समाप्त हो चुका हो या इससे कम दिन बचे हों, तब डाउन। अपने अंतराल पर जाँचा जाता है, तेज़ पुनःप्रयास के बिना।"
      push_hint: "Shango इस मॉनिटर को एक गुप्त URL देता है। आपका जॉब, क्रॉन या बैकअप हर बार चलने पर इसे कॉल करता है; अंतराल और छूट अवधि के भीतर कोई कॉल न आने पर मॉनिटर डाउन हो जाता है।"
      push_conditions_hint: "अंतराल बताता है कि आपका जॉब कितनी बार चलता है; छूट अवधि लंबे चलने वाले रन को कवर करती है। पहली समयसीमा चूकने के बाद डाउन मानने से पहले 30 सेकंड बाद फिर जाँचा जाता है।"
      tcp_hint: "लगातार इतने कनेक्शन अस्वीकार होने या उत्तर न मिलने पर डाउन; विफलता के बाद अगली जाँच 30 सेकंड बाद होती है।"
    card:
      expires: "%{date} को समाप्त"
      last_ping: "पिछला पिंग %{time} पहले"
      no_ping: "पहले पिंग का इंतज़ार"
    intervals:
      days: "हर %{value} दिन"
    durations:
      none: "कोई नहीं"
      minutes: "%{value} मिनट"
      hours: "%{value} घंटे"
    push:
      title: "पुश URL"
      once: "इसे अभी कॉपी करें: यह दोबारा नहीं दिखेगा। अपने जॉब के हर रन के अंत में इसे GET या POST से कॉल करें।"
      examples: "उदाहरण के लिए, curl से (दूसरा तरीका टोकन को URL और प्रॉक्सी लॉग से बाहर रखता है):"
      hidden: "पुश URL गुप्त है और केवल एक बार दिखाया गया था। खो जाने पर नया बनाएँ; पुराना काम करना बंद कर देगा।"
      regenerate: "नया पुश URL"
      confirm: "नया पुश URL बनाएँ? मौजूदा तुरंत काम करना बंद कर देगा, इसलिए अपना जॉब अपडेट करें।"
    monitors:
      tokens:
        create:
          regenerated: "नया पुश URL बन गया। नीचे से कॉपी करें।"
    causes:
      no_ping: "समय पर कोई पिंग नहीं"
      invalid_host: "होस्ट मान्य नाम या IP पता नहीं है"
      no_certificate: "सर्वर ने कोई प्रमाणपत्र नहीं भेजा"
      untrusted_certificate: "अविश्वसनीय प्रमाणपत्र"
      hostname_mismatch: "प्रमाणपत्र इस होस्ट के लिए मान्य नहीं है"
      certificate_not_yet_valid: "प्रमाणपत्र अभी मान्य नहीं है"
      certificate_expired: "प्रमाणपत्र समाप्त हो गया"
      certificate_expiring: "प्रमाणपत्र जल्द समाप्त होगा"

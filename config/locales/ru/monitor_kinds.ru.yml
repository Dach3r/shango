      ssl_hint: "Недоступен, если сертификат не доверенный, не подходит к хосту, истёк или истекает раньше этого числа дней. Проверяется по интервалу, без быстрого повтора."
      domain_hint: "Недоступен, если домен не зарегистрирован, истёк, приостановлен, скоро будет удалён или истекает раньше этого числа дней. Если реестр не отвечает, статус неизвестен, а не «недоступен». Укажите зарегистрированный домен или любое имя под ним."
      push_hint: "Shango выдаёт этому монитору секретный URL. Ваша задача, cron или бэкап вызывает его при каждом запуске; монитор становится недоступным, если вызова нет в течение интервала и льготного периода."
      push_conditions_hint: "Интервал — как часто запускается задача; льготный период покрывает долгие запуски. После первого пропущенного срока проверка повторяется через 30 секунд, прежде чем монитор будет считаться недоступным."
      tcp_hint: "Недоступен после стольких отклонённых или оставшихся без ответа соединений подряд; после сбоя следующая проверка — через 30 секунд."

      hint: "Revisa cómo está configurado el correo de un dominio solo con DNS: SPF con las consultas que cuesta, claves DKIM, la política DMARC y los servidores MX. Los selectores DKIM no se pueden descubrir, así que escribe los tuyos después del dominio; sin ellos, se prueban los comunes."

          missing: "No hay registro DMARC, así que nada indica a los receptores qué hacer con el correo que falla SPF y DKIM."
          multiple: "Hay más de un registro DMARC. Los receptores los ignoran todos: deja uno."
          lookup_failed: "El resolvedor no pudo leer %{name}."
          invalid_policy: "Falta la política (p) o no es none, quarantine ni reject."
          policy_none: "La política es none: los fallos solo se reportan. Pasa a quarantine o reject cuando los reportes se vean limpios."
          weak_subdomain_policy: "Los subdominios usan %{sp}, más débil que el %{p} del dominio."
          partial: "La política se aplica a solo el %{pct}% del correo que falla."
          no_reports: "No hay dirección rua, así que no recibes reportes agregados."
        mx:
          missing: "No hay registro MX: el correo recurre al registro A del dominio, o es rechazado."
          lookup_failed: "El resolvedor no pudo leer %{name}."
          cname: "%{host} es un alias (CNAME), y un MX no puede apuntar a uno."
          unresolved: "%{host} no resuelve a ninguna dirección."

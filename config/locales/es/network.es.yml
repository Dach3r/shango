          include_missing: "El registro referencia a %{name}, pero este no tiene un registro SPF válido."
          no_all: "El registro no termina con un término all, así que el correo de otros servidores no queda cubierto. Termínalo con -all o ~all."
          pass_all: "El registro termina con +all, lo que permite a cualquier servidor enviar correo como este dominio."
          neutral_all: "El registro termina con ?all, que no da veredicto sobre otros servidores. Usa ~all o -all."
          ptr: "El mecanismo ptr está obsoleto y es lento. Reemplázalo por ip4, ip6 o include."
        dkim:
          selector_missing: "No se encontró clave DKIM para el selector %{selector}."
          lookup_failed: "El resolvedor no pudo leer %{name}."
          revoked: "La clave del selector %{selector} está vacía: fue revocada."
          invalid_key: "La clave del selector %{selector} no se puede leer."
          weak_key: "La clave del selector %{selector} tiene solo %{bits} bits. Usa 2048."
          testing: "El selector %{selector} está en modo de prueba (t=y), así que los receptores pueden ignorar sus firmas."
          none_found: "Ninguno de los selectores comunes tiene clave DKIM. Escribe tu selector después del dominio para revisarlo."

      domain_on_hold: "El dominio está suspendido y no resuelve"
      domain_pending_delete: "El dominio está por ser eliminado"
      no_rdap_service: "El registro de este dominio no tiene servicio RDAP"
      rdap_unavailable: "El registro no respondió"
      no_expiry: "El registro no informa fecha de vencimiento"
      no_ping: "Sin ping a tiempo"
      invalid_host: "El host no es un nombre ni una IP válidos"
      no_certificate: "El servidor no envió certificado"
      untrusted_certificate: "Certificado no confiable"
      hostname_mismatch: "El certificado no es válido para este host"

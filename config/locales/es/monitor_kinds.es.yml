es:
  activerecord:
    errors:
      models:
        uptime_monitor:
          attributes:
            base:
              push_token: "Un monitor push necesita su token secreto."
    attributes:
      uptime_monitor:
        expires_at: "Vence"
        last_pinged_at: "Último ping"
  monitoring:
    kind_hints:
      http: "Pide una URL y revisa el estado y el tiempo de respuesta."
      tcp: "Abre una conexión TCP a un host y puerto, y la cierra enseguida."
      ssl: "Revisa el certificado TLS de un host: de confianza, válido para el nombre y sin estar por vencer."
      domain: "Revisa cuándo vence el registro de un dominio, mediante RDAP."
      push: "Espera a que tu job, cron o backup llame a una URL secreta; se marca caído cuando la llamada no llega."
    new:
      choose: "Elige qué monitorear."
    form:
      host_placeholder: "example.com o {{host}}"
      host_hint: "Un nombre de host o una dirección IP. Las variables vienen del entorno elegido abajo; no se pueden usar variables secretas."
      ssl_hint: "Se marca caído cuando el certificado no es de confianza, no es válido para el host, está vencido o le quedan menos días que este número. Se revisa en su intervalo, sin el reintento rápido."
      domain_hint: "Se marca caído cuando el dominio no está registrado, venció, está suspendido, está por eliminarse o vence en menos días que este número. Un registro que no responde queda como desconocido, nunca caído. Usa el dominio registrado o cualquier nombre debajo de él."
      push_hint: "Shango le da a este monitor una URL secreta. Tu job, cron o backup la llama cada vez que corre; el monitor se cae cuando no llega ninguna llamada dentro del intervalo más el período de gracia."
      push_conditions_hint: "El intervalo es cada cuánto corre tu job; el período de gracia cubre las ejecuciones que tardan más. Tras el primer plazo vencido se revisa de nuevo 30 segundos después antes de contarlo como caído."
      tcp_hint: "Se marca caído tras esta cantidad de conexiones rechazadas o sin respuesta seguidas; después de un fallo el siguiente chequeo corre 30 segundos más tarde."
    card:
      expires: "vence %{date}"
      last_ping: "último ping hace %{time}"
      no_ping: "esperando el primer ping"
    intervals:
      days: "Cada %{value} d"
    durations:
      none: "Ninguna"
      minutes: "%{value} min"
      hours: "%{value} h"
    push:
      title: "URL de push"
      once: "Cópiala ahora: no se vuelve a mostrar. Llámala con GET o POST al final de cada ejecución de tu job."
      examples: "Por ejemplo, con curl (la segunda forma deja el token fuera de las URLs y de los logs de proxies):"
      hidden: "La URL de push es secreta y se mostró una sola vez. Crea una nueva si la perdiste; la anterior deja de funcionar."
      regenerate: "Nueva URL de push"
      confirm: "¿Crear una nueva URL de push? La actual deja de funcionar de inmediato, así que actualiza tu job."
    monitors:
      tokens:
        create:
          regenerated: "Nueva URL de push creada. Cópiala abajo."
    causes:
      domain_not_registered: "El dominio no está registrado"
      domain_expired: "El dominio venció"

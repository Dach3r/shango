    automation:
      script_error: Erreur de script
      script_where: "%{phase} de %{level}"
      phases:
        pre: Script avant la requête
        post: Script après la réponse
      script_levels:
        collection: la collection %{name}
        folder: le dossier %{name}
        request: la requête %{name}
      script_error_in: "%{where} : %{message}"
      scripts:
        tab: Scripts
        pre:
          title: Script avant la requête
          hint: S'exécute avant la construction de la requête. Modifiez des variables avec pm.environment.set(), ou la requête avec pm.request.
        post:
          title: Script après la réponse
          hint: S'exécute à l'arrivée de la réponse. Écrivez des tests avec pm.test() et pm.expect(), et enregistrez des valeurs avec pm.environment.set().
        reference: JavaScript avec l'API pm (un sous-ensemble de celle de Postman). Ni réseau ni fichiers ; chaque script s'arrête après quelques secondes.
      console:
        title: Console
        empty: Les scripts n'ont rien écrit dans la console.
      inherited:
        title: Tests pour chaque requête ci-dessous
        hint: Les assertions et extracteurs d'ici s'exécutent, dans cet ordre, avant ceux de la requête elle-même, pour chaque requête qu'il contient.
      assertions:
        title: Assertions
        hint: Chaque assertion activée est vérifiée sur chaque réponse. Les {{variables}} fonctionnent dans la valeur attendue.
        add: Ajouter une assertion
      extractors:
        title: Extracteurs
        hint: Copient une valeur de la réponse dans une variable d'environnement, pour que la requête suivante puisse l'utiliser.
        add: Ajouter un extracteur
      extractor_title: Définir %{variable} depuis %{from}
      extractor_unsaved: Les valeurs extraites n'ont pas été enregistrées dans l'environnement
      actual: 'Obtenu : %{value}'
      targets:
        json: JSONPath, p. ex. $.data.id
        header: Nom de l'en-tête
      sources:
        status: Code de statut
        header: En-tête
        json: JSON
        body: Corps
        time: Durée (ms)
        size: Taille (octets)
      operators:
        equals: est égal à
        not_equals: n'est pas égal à
        lt: est inférieur à
        gt: est supérieur à
        in_range: est compris dans
        exists: existe
        not_exists: n'existe pas
        contains: contient
        not_contains: ne contient pas
        matches: correspond à
        type: est de type
        length: a la longueur
        is_empty: est vide
      errors:
        unsupported: Cette vérification n'est pas prise en charge.
        invalid_expected: La valeur attendue n'est pas valide pour cette vérification.
        invalid_json: Le corps de la réponse n'est pas du JSON valide.
        invalid_path: Le JSONPath n'est pas valide.
        invalid_pattern: Le motif n'est pas une expression régulière valide.
        pattern_timeout: Le motif a mis trop de temps à s'exécuter.
        not_found: Rien trouvé à ce chemin.
        not_a_number: La valeur n'est pas un nombre.
        no_length: La valeur n'a pas de longueur.
        no_environment: Sélectionnez un environnement pour enregistrer les valeurs extraites.
        not_permitted: Vous ne pouvez pas modifier cet environnement ; les valeurs n'ont donc pas été enregistrées.
    imports:
      warnings:
        scripts_unsupported: "« %{name} » utilise des fonctions de script que Shango n'a pas (%{apis}). Le script a été importé tel quel ; ces appels échoueront."
    executions:
      errors:
        script_error: Un script a échoué avant l'envoi de la requête.
      tabs:
        console: Console
        tests: Tests

        api_request:
          attributes:
            base:
              invalid_extractor_variable: Les noms de variable des extracteurs ne peuvent contenir que des lettres, des chiffres, des points, des tirets et des tirets bas, et ne peuvent pas commencer par un chiffre.
  components:
    request_tree:
      run: Exécuter
      run_history: Historique des exécutions

          empty: Il n'y a aucune requête à exécuter ici.
          too_many: Une exécution peut envoyer au plus %{max} requêtes.
      index:
        title: Exécutions de %{name}
        new: Nouvelle exécution
        empty: Cette collection n'a pas encore été exécutée.
      show:
        title: Exécution de %{name}

        cancel: Annuler l'exécution
        run_again: Exécuter à nouveau
        passed: Réussi
        failed: Échoué
        total: Requêtes
        duration: Durée
        progress: Progression de l'exécution
        by: par %{name}
        no_tests: Cette requête n'a aucune assertion.

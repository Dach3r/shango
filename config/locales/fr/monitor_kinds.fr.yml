      tcp_hint: "En panne après autant de connexions refusées ou sans réponse d’affilée ; après un échec, la vérification suivante a lieu 30 secondes plus tard."
    card:
      expires: "expire le %{date}"
    causes:
      invalid_host: "L’hôte n’est ni un nom ni une adresse IP valides"
      no_certificate: "Le serveur n’a envoyé aucun certificat"
      untrusted_certificate: "Certificat non fiable"
      hostname_mismatch: "Le certificat n’est pas valide pour cet hôte"
      certificate_not_yet_valid: "Le certificat n’est pas encore valide"
      certificate_expired: "Le certificat a expiré"
      certificate_expiring: "Le certificat expire bientôt"

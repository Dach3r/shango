fr:
  activerecord:
    attributes:
      uptime_monitor:
        expires_at: "Expire"
  monitoring:
    kind_hints:
      http: "Interroge une URL et vérifie le statut et le temps de réponse."
      tcp: "Ouvre une connexion TCP vers un hôte et un port, puis la ferme aussitôt."
      ssl: "Vérifie le certificat TLS d’un hôte : de confiance, valide pour le nom et pas près d’expirer."
      domain: "Vérifie via RDAP quand l’enregistrement d’un domaine expire."
      push: "Attend que votre tâche, cron ou sauvegarde appelle une URL secrète ; en panne si l’appel n’arrive pas."
    new:
      choose: "Choisissez ce qu’il faut surveiller."
    form:
      host_placeholder: "example.com ou {{host}}"
      host_hint: "Un nom d’hôte ou une adresse IP. Les variables viennent de l’environnement choisi plus bas ; les variables secrètes ne sont pas permises."

fr:
  activerecord:
    errors:
      models:
        uptime_monitor:
          attributes:
            base:
              push_token: "Un moniteur push a besoin de son jeton secret."
    attributes:
      uptime_monitor:
        expires_at: "Expire"
        last_pinged_at: "Dernier ping"
  monitoring:
    kind_hints:
      http: "Interroge une URL et vérifie le statut et le temps de réponse."
      tcp: "Ouvre une connexion TCP vers un hôte et un port, puis la ferme aussitôt."
      ssl: "Vérifie le certificat TLS d’un hôte : de confiance, valide pour le nom et pas près d’expirer."
      domain: "Vérifie via RDAP quand l’enregistrement d’un domaine expire."
      push: "Attend que votre tâche, cron ou sauvegarde appelle une URL secrète ; en panne si l’appel n’arrive pas."
    new:
      choose: "Choisissez ce qu’il faut surveiller."
    form:
      host_placeholder: "example.com ou {{host}}"
      host_hint: "Un nom d’hôte ou une adresse IP. Les variables viennent de l’environnement choisi plus bas ; les variables secrètes ne sont pas permises."
      ssl_hint: "En panne si le certificat n’est pas de confiance, pas valide pour l’hôte, expiré, ou expire dans moins de jours que ce nombre. Vérifié à son intervalle, sans nouvel essai rapide."
      modes:
        url: "Une URL"
        request: "Une requête enregistrée du client API"
      request_hint: "Envoyée telle qu’enregistrée (méthode, en-têtes, corps et authentification) avec l’environnement choisi plus bas ; les variables secrètes fonctionnent et rien de la réponse n’est conservé. Les brouillons ne sont pas utilisés."
      domain_hint: "En panne si le domaine n’est pas enregistré, a expiré, est suspendu, va être supprimé ou expire dans moins de jours que ce nombre. Un registre qui ne répond pas donne un statut inconnu, jamais en panne. Utilisez le domaine enregistré ou n’importe quel nom en dessous."
      push_hint: "Shango donne à ce moniteur une URL secrète. Votre tâche, cron ou sauvegarde l’appelle à chaque exécution ; le moniteur tombe si aucun appel n’arrive dans l’intervalle plus le délai de grâce."
      push_conditions_hint: "L’intervalle est la fréquence d’exécution de votre tâche ; le délai de grâce couvre les exécutions plus longues. Après la première échéance manquée, une nouvelle vérification a lieu 30 secondes plus tard avant de le compter en panne."
      tcp_hint: "En panne après autant de connexions refusées ou sans réponse d’affilée ; après un échec, la vérification suivante a lieu 30 secondes plus tard."
    card:
      expires: "expire le %{date}"
      last_ping: "dernier ping il y a %{time}"
      no_ping: "en attente du premier ping"
    intervals:
      days: "Tous les %{value} j"
    durations:
      none: "Aucune"
      minutes: "%{value} min"
      hours: "%{value} h"
    push:
      title: "URL de push"
      once: "Copiez-la maintenant : elle ne sera plus affichée. Appelez-la en GET ou POST à la fin de chaque exécution de votre tâche."
      examples: "Par exemple avec curl (la seconde forme garde le jeton hors des URL et des journaux de proxy) :"
      hidden: "L’URL de push est secrète et n’a été affichée qu’une fois. Créez-en une nouvelle si vous l’avez perdue ; l’ancienne cessera de fonctionner."
      regenerate: "Nouvelle URL de push"
      confirm: "Créer une nouvelle URL de push ? L’actuelle cesse aussitôt de fonctionner, mettez donc à jour votre tâche."
    monitors:
      tokens:
        create:
          regenerated: "Nouvelle URL de push créée. Copiez-la ci-dessous."
    causes:
      request_missing: "Sa requête enregistrée a été supprimée"
      auth_failed: "L’authentification de la requête a échoué"
      invalid_request: "La requête enregistrée ne peut pas être envoyée"
      domain_not_registered: "Le domaine n’est pas enregistré"
      domain_expired: "Le domaine a expiré"
      domain_expiring: "Le domaine expire bientôt"
      domain_on_hold: "Le domaine est suspendu et ne se résout pas"
      domain_pending_delete: "Le domaine est sur le point d’être supprimé"
      no_rdap_service: "Le registre de ce domaine n’a pas de service RDAP"
      rdap_unavailable: "Le registre n’a pas répondu"
      no_expiry: "Le registre ne donne pas de date d’expiration"
      no_ping: "Pas de ping à temps"
      invalid_host: "L’hôte n’est ni un nom ni une adresse IP valides"
      no_certificate: "Le serveur n’a envoyé aucun certificat"
      untrusted_certificate: "Certificat non fiable"

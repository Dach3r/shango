        title: "Nothing to show yet"
        hint: "Enter a domain and check its DNS records."
      ports:
        title: "Nothing to show yet"
        hint: "Enter a host and the ports to check."
      ping:
        title: "Nothing to show yet"
        hint: "Enter a host and start a TCP ping."
      subnet:
        title: "Nothing to show yet"
        hint: "Enter a network, such as 192.168.1.0/24, to see its range."
      tls:
        title: "Nothing to show yet"
        hint: "Enter a host to inspect its TLS certificate."
      email:
        title: "Nothing to show yet"
        hint: "Enter a domain to check its SPF, DKIM, DMARC and MX records."
      lookup:
        title: "Nothing to show yet"
        hint: "Enter a domain or an IP address to see who is behind it."
    history:
      dns: "DNS checks"
      ports: "Port checks"
      ping: "TCP pings"
      subnet: "Subnets"
      empty: "Nothing checked yet."
      clear: "Clear"
      ago: "%{time} ago"
      delete: "Delete run"
      confirm_clear: "Delete this tool's whole history for the project?"
      confirm_delete: "Delete this run?"
      previous: "Previous run, %{time} ago: %{detail}"
      tls: "TLS certificates"
      email: "Email checks"
      lookup: "Lookups"
    guide:
      title: "Reading the results"
      ok: "The server answered with records."
      cname: "Only an alias came back; the target holds the records."
      nodata: "The name exists but has no record of this type."
      nxdomain: "The name does not exist."
      servfail: "The resolver failed to get an answer from the zone."
      timeout: "The server did not reply in time."
      open: "A service accepted the connection."
      closed: "The host answered, but nothing listens on this port."
      filtered: "No answer. A firewall may be dropping the packets."
      inside: "The address belongs to this network."
      outside: "The address is outside this network, or is of the other IP version."
      trusted: "The chain leads to a root that browsers and systems trust."
      untrusted: "No trusted chain: self-signed, unknown root or a missing intermediate."
      valid: "Within its validity dates."
      expiring: "Close to expiry: renewal should already have happened."
      expired: "Past its expiry date; clients refuse it."
      healthy: "No problems found in this part."
      attention: "Works, but something should be fixed."
      broken: "A problem that breaks delivery or leaves the domain unprotected."
      missing: "No record found."
      signed: "The zone is signed: resolvers can verify its answers."
      unsigned: "The zone is not signed with DNSSEC."
    limits:
      about: "About"
    results:
      monitor: "Monitor this"
      propagation: "Propagation"
      target: "Target"
      min: "Min"
      avg: "Avg"

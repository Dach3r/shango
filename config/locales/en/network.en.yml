      nxdomain: Not found
      servfail: Server failure
      refused: Refused
      timeout: Timeout
      error: Error
      blocked: Blocked
      unresolved: No address
      match: Matches
      mismatch: Differs
      no_answer: No answer
      confirmed: "Confirmed"
      unconfirmed: "Not confirmed"
      open: Open
      closed: Closed
      filtered: Filtered
      inside: "Inside"
      outside: "Outside"
      trusted: "Trusted"
      untrusted: "Untrusted"
      valid: "Valid"
      expiring: "Expiring"
      expired: "Expired"
      not_yet_valid: "Not yet valid"
      healthy: "Healthy"
      attention: "Needs attention"
      broken: "Broken"
      missing: "Missing"
      signed: "Signed"
      unsigned: "Unsigned"
    dns:
      domain: Domain
      hint: "DNS answers come from the authoritative nameservers and several public resolvers, so you can tell whether a change has propagated. For PTR, enter an IP address: the check also confirms that each name resolves back to it."
      domain_placeholder: example.com 203.0.113.10
      ptr_placeholder: 203.0.113.10 mail.example.com
      type: Type
      submit: Check DNS
      no_authoritative: The authoritative nameservers of this domain could not be determined.
      forward:
        title: "Forward-confirmed reverse DNS"
        none: "No PTR record to confirm."
      summary:
        expected: "%{matched} of %{total} resolvers match the expected value"
        answered: "%{answered} of %{total} resolvers answered"
        agree: All answers agree.
        differ: Answers differ between resolvers, so the change may still be propagating.
      groups:
        authoritative: Authoritative nameservers
        public: Public resolvers
      columns:
        resolver: Resolver
        answer: Answer
        ttl: TTL
        latency: Latency
        status: Status
    ports:
      host: Host
      host_placeholder: example.com, 203.0.113.10 or {{host}}
      ports: Ports
      ports_placeholder: 22, 80, 443 or 8000-8010
      preset: Port preset
      presets:
        common: Common
        web: "Web (%{ports})"
        mail: "Mail (%{ports})"
        database: "Databases (%{ports})"
        custom: Custom
      submit: Check ports
      hint: "A port check tries a TCP connection to each port, so you can see what a host exposes and what a firewall hides. Pick a preset or type ports separated by commas, with ranges like 8000-8010."
      summary: "%{open} open, %{closed} closed, %{filtered} filtered"
      all_filtered: Nothing answered. A firewall may be dropping the packets, or the host may be offline.
      columns:
        port: Port
        service: Usual service
        latency: Latency
        status: Status
    ping:
      host: Host
      host_placeholder: example.com, 203.0.113.10 or {{host}}
      port: Port
      attempts: Attempts
      attempts_option: "Attempts: %{count}"
      hint: This is a TCP ping, not ICMP. A refused connection still proves the host is online; only silence counts as loss.
      submit: Start ping
      summary: "%{received} of %{sent} answered, %{loss}% loss"
      only_refused: The host answers, but nothing is listening on this port.
      no_answer: No answer. The host may be offline, or a firewall may be dropping the packets.
      stopped: "Stopped after %{count} timeouts in a row."
    subnet:
      network: "Network"
      network_placeholder: "192.168.1.0/24 or 2001:db8::/48"
      split: "Split into"
      split_placeholder: /26
      contains: "Contains IP"
      contains_placeholder: 192.168.1.77
      submit: "Calculate"
      hint: "Works out the range of an IPv4 or IPv6 network from a prefix or a mask. Optionally split it into longer prefixes, or check whether an address belongs to it. Nothing is sent over the network."
      family: "IPv%{version}"
      scopes:
        public: "Public"
        private: "Private"
        loopback: "Loopback"
        link_local: "Link-local"
      fields:
        address: "Address"
        network: "Network"
        netmask: "Netmask"
        wildcard: "Wildcard"
        broadcast: "Broadcast"
        first: "First host"
        last: "Last host"
        size: "Addresses"
        hosts: "Usable hosts"
      contains_title: "Address check"
      split_title: "%{count} subnets of /%{prefix}"
      split_truncated: "Showing the first %{shown} of %{count}."
      summary: "IPv%{version} · %{hosts} usable hosts"
    tls:
      host: Host
      host_placeholder: example.com, 203.0.113.10 or {{host}}
      port: Port
      protocol: "Protocol"
      protocols:
        tls: "Direct TLS"
        smtp: "STARTTLS · SMTP"
        imap: "STARTTLS · IMAP"
        pop3: "STARTTLS · POP3"
      submit: "Check certificate"
      hint: "Connects to the host and checks the certificate it presents: trusted chain, host name, dates, key and protocol. A bad certificate is reported with what is wrong instead of failing. Leave the port empty to use the usual one of the protocol; mail servers on 587, 143 and 110 need STARTTLS."
      summary:
        valid: "Expires %{date} · %{version}"
        expired: "Expired %{date} · %{version}"
        not_yet_valid: "Valid from %{date} · %{version}"
      trust: "Chain"
      hostname: "Host name"
      days_left: "Days left"
      findings_title: "Findings"
      no_findings: "No problems found."
      findings:
        expired: "The certificate expired on %{date}."
        not_yet_valid: "The certificate is not valid until %{date}."
        expiring: "The certificate expires on %{date}. Renew it soon."
        name_mismatch: "The certificate does not cover %{host}."
        untrusted:
          self_signed: "The certificate is self-signed, so no client trusts it by default."
          untrusted_root: "The chain ends in a root that is not trusted."
          unknown_issuer: "The chain does not reach a trusted root: an intermediate certificate is missing or the issuer is unknown."
          other: "The chain could not be verified (OpenSSL error %{code})."
        old_protocol: "The server negotiated %{version}, which is deprecated. Enable TLS 1.2 or 1.3."
        weak_key: "The %{type} key has only %{bits} bits."
        weak_signature: "The certificate is signed with %{algorithm}, which is no longer secure."
      certificate_title: "Certificate"
      fields:
        subject: "Subject"
        issuer: "Issuer"
        not_before: "Valid from"
        not_after: "Valid until"
        key: "Key"
        signature: "Signature"
        serial: "Serial number"
        sha256: "SHA-256 fingerprint"
      names_title: "Names (%{total})"
      names_truncated: "Showing the first %{shown} of %{total}."
      connection_title: "Connection"
      connection:
        version: "Protocol"
        cipher: "Cipher"
        alpn: "ALPN"
        sni: "SNI"
      chain_title: "Chain sent by the server"
      issued_by: "Issued by %{issuer}"
      self_signed: "Self-signed"
    email:
      domain: "Domain"
      domain_placeholder: "example.com selector1 selector2"
      submit: "Check email DNS"
      hint: "Checks how a domain is set up for email using DNS only: SPF with the lookups it costs, DKIM keys, the DMARC policy and MX servers. DKIM selectors cannot be discovered, so type yours after the domain; without any, the common ones are tried."
      summary:
        clean: "No problems found"
        issues: "%{bad} errors · %{warn} warnings"
      sections:
        spf: "SPF"
        dkim: "DKIM"
        dmarc: "DMARC"
        mx: "MX"
      findings_title: "Findings"
      no_findings: "No problems found."
      findings:
        spf:
          missing: "There is no SPF record, so receivers cannot tell which servers may send mail for this domain."
          multiple: "There is more than one SPF record. Receivers reject them all: merge them into one."
          lookup_failed: "The resolver could not read %{name}, so this part may be incomplete."
          too_many_lookups: "The record needs %{count} DNS lookups, over the limit of %{limit}. Receivers reject it: remove includes or flatten them."
          loop: "%{name} includes itself, directly or through other records."
          include_missing: "%{name} is referenced by the record but has no valid SPF record."
          no_all: "The record does not end with an all term, so mail from other servers is not covered. End it with -all or ~all."
          pass_all: "The record ends with +all, which lets any server send mail as this domain."
          neutral_all: "The record ends with ?all, which gives no verdict on other servers. Use ~all or -all."
          ptr: "The ptr mechanism is deprecated and slow. Replace it with ip4, ip6 or include."
        dkim:
          selector_missing: "No DKIM key found for the selector %{selector}."
          lookup_failed: "The resolver could not read %{name}."
          revoked: "The key of the selector %{selector} is empty: it was revoked."
          invalid_key: "The key of the selector %{selector} cannot be read."
          weak_key: "The key of the selector %{selector} has only %{bits} bits. Use 2048."
          testing: "The selector %{selector} is in testing mode (t=y), so receivers may ignore its signatures."
          none_found: "None of the common selectors has a DKIM key. Type your selector after the domain to check it."
        dmarc:
          missing: "There is no DMARC record, so nothing tells receivers what to do with mail that fails SPF and DKIM."
          multiple: "There is more than one DMARC record. Receivers ignore them all: keep one."
          lookup_failed: "The resolver could not read %{name}."
          invalid_policy: "The policy (p) is missing or is not none, quarantine or reject."
          policy_none: "The policy is none: failures are only reported. Move to quarantine or reject once the reports look clean."
          weak_subdomain_policy: "Subdomains use %{sp}, which is weaker than the %{p} of the domain."
          partial: "The policy is applied to only %{pct}% of failing mail."
          no_reports: "There is no rua address, so you receive no aggregate reports."
        mx:
          missing: "There is no MX record: mail falls back to the A record of the domain, or is rejected."
          lookup_failed: "The resolver could not read %{name}."
          cname: "%{host} is an alias (CNAME), which an MX is not allowed to point to."
          unresolved: "%{host} does not resolve to an address."
      spf:
        lookups: "DNS lookups"
        ends_with: "Ends with"
      dkim:
        none: "No selectors found."
        none_probed: "No DKIM key found among the common selectors."
        probed: "Tried %{count} common selectors. Type yours after the domain if it is not among them."
        statuses:
          revoked: "Revoked"
          invalid: "Invalid"
          missing: "Not found"
          unavailable: "No answer"
      dmarc:
        policy: "Policy"
        subdomain_policy: "Subdomains"
        pct: "Applied (%)"
        rua: "Reports to"
        inherited: "Record found at %{domain}, which covers this domain."
      mx:
        no_mail: "This domain declares that it receives no mail (null MX)."
        statuses:
          ok: "Resolves"
          cname: "Alias"
          unresolved: "No address"
          unavailable: "No answer"
    lookup:
      host: "Domain or IP address"
      host_placeholder: "example.com or 203.0.113.9"
      submit: "Look up"
      hint: "Shows who is behind a domain or an IP address from public registration data (RDAP) and the routing table: registrar, dates, status, nameservers and DNSSEC for a domain; the network, the organization that holds it, its abuse contact and the autonomous system (ASN) for an IP address. Only registrars, organizations and abuse contacts are read: no personal data. The target itself is never contacted."
      summary:
        domain: "Expires %{date} · %{registrar}"
        expired: "Expired %{date} · %{registrar}"
        no_expiry: "Registered with %{registrar}"
        ip: "%{asn} · %{name}"
        ip_no_asn: "%{name}"
      findings_title: "Findings"
      no_findings: "No problems found."
      findings:
        expired: "The domain expired on %{date}."
        expiring: "The domain expires on %{date}. Renew it soon."
        hold: "The registry or the registrar has put the domain on hold, so it does not resolve."
        pending_delete: "The domain is in its redemption or pending-delete period and will be released unless it is renewed."
        rdap_failed: "The registration data service did not answer, so the network details are missing."
        not_announced: "No autonomous system announces this address, so it is probably not routed on the internet."
        asn_unavailable: "The routing data could not be read, so the autonomous system is missing."
      domain_title: "Domain"
      network_title: "Network"
      asn_title: "Autonomous system"
      nameservers_title: "Nameservers (%{count})"
      registered_domain: "Registration data for %{name}, the registered domain of the name you typed."
      fields:
        days_left: "Days left"
        dnssec: "DNSSEC"
        nameservers: "Nameservers"
        asn: "ASN"
        country: "Country"
        prefix: "Announced prefix"
        registrar: "Registrar"
        iana_id: "IANA registrar ID"
        registered: "Registered"
        expires: "Expires"
        updated: "Last changed"
        abuse: "Abuse contact"
        statuses: "Status"
        name: "Name"
        handle: "Handle"
        type: "Type"
        range: "Range"
        cidr: "Prefixes"
        organization: "Organization"

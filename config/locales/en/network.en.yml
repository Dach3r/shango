    errors:
      blank: Enter a domain or host.
      invalid: "That is not a valid host name or IP address. Use only the name, without scheme, path or port."
      unresolved_variable: "The variable {{%{name}}} is not defined or is disabled in the selected environment."
      secret_variable: "The variable {{%{name}}} is secret and cannot be used as a network target."
      blocked: "This host is not allowed: %{detail}."
      unresolved: The host name does not resolve.
      invalid_type: Choose a supported record type.
      ptr_needs_ip: "Reverse DNS (PTR) needs an IP address, such as 203.0.113.10."
      blank_ports: Enter at least one port.
      invalid_ports: "\"%{token}\" is not a valid port. Use numbers from 1 to 65535, ranges like 8000-8010, or common."
      too_many_ports: "Check at most %{max} ports at a time."
      invalid_port: Enter a port between 1 and 65535.
      invalid_attempts: "Choose between 1 and %{max} attempts."
      blank_network: "Enter a network, such as 192.168.1.0/24."
      invalid_network: "\"%{token}\" is not a valid network. Use an address with a prefix (192.168.1.0/24, 2001:db8::/48) or with a mask (192.168.1.0 255.255.255.0)."
      invalid_split: "Split into a prefix from /%{min} to /%{max}."
      invalid_ip: "\"%{token}\" is not a valid IP address."
      invalid_protocol: "Choose a supported protocol."
      connection_refused: "The host refused the connection: nothing is listening on that port."
      connection_timeout: "The host did not answer in time. A firewall may be dropping the packets."
      handshake_failed: "The TLS handshake failed (%{detail}). The port may not speak TLS, or it may need STARTTLS."
      starttls_refused: "The server did not offer or accept STARTTLS. Check the protocol and the port."
      no_certificate: "The server did not present a certificate."
      domain_needed: "Enter a domain name, such as example.com. An IP address has no mail records."
      domain_not_found: "This domain does not exist."
      invalid_selector: "\"%{token}\" is not a valid DKIM selector. Use letters, numbers, hyphens, underscores and dots."
      too_many_selectors: "Check at most %{max} DKIM selectors at a time."
      not_registered: "This domain is not registered."
      no_rdap_service: "No RDAP service is published for this top-level domain or address range."
      rdap_unavailable: "The registration data service did not answer correctly. Try again later."
      private_address: "Private, loopback and reserved addresses have no public registration data."
    statuses:
      ok: Answered
      cname: Alias

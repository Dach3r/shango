      mismatch: 不一致
      no_answer: 応答なし
      open: オープン
      closed: クローズ
      filtered: フィルタ済み
    dns:
      intro: パブリックリゾルバーとドメインの権威ネームサーバーにレコードを問い合わせて、DNSの変更が反映されたかを確認します。
      domain: ドメイン
      domain_placeholder: "example.com または {{host}}"
      type: タイプ
      expected: 期待値
      expected_placeholder: 203.0.113.10
      expected_hint: 任意です。各リゾルバーが一致しているかどうかが表示され、変更がどこまで広がったかを確認できます。
      submit: DNSを確認
      no_authoritative: このドメインの権威ネームサーバーを特定できませんでした。
      summary:
        expected: "%{total} 件中 %{matched} 件のリゾルバーが期待値と一致しています"
        answered: "%{total} 件中 %{answered} 件のリゾルバーが応答しました"
        agree: すべての応答が一致しています。
        differ: リゾルバー間で応答が異なります。変更がまだ反映中の可能性があります。
      groups:
        authoritative: 権威ネームサーバー
        public: パブリックリゾルバー
      columns:
        resolver: リゾルバー
        answer: 応答
        ttl: TTL
        latency: レイテンシ
        status: ステータス
    ports:
      intro: ファイアウォールの変更やサービスのデプロイ後などに、Shango サーバーからホストのどの TCP ポートが応答するかを確認します。
      host: ホスト
      host_placeholder: "example.com、203.0.113.10 または {{host}}"
      ports: ポート
      ports_placeholder: "22, 80, 443 または 8000-8010"
      ports_hint: "数値、範囲、common をカンマ区切りで指定します。最大 %{max} 個まで。"
      submit: ポートを確認
      summary: "オープン %{open}、クローズ %{closed}、フィルタ済み %{filtered}"
      all_filtered: 応答がありませんでした。ファイアウォールがパケットを破棄しているか、ホストがオフラインの可能性があります。
      columns:
        port: ポート
        service: 一般的なサービス
        latency: レイテンシ
        status: ステータス
    ping:
      intro: ポートへの TCP 接続を複数回開き、その所要時間を測定して、ホストが応答するかを確認します。
      host: ホスト
      host_placeholder: "example.com、203.0.113.10 または {{host}}"
      port: ポート
      attempts: 試行回数
      hint: これは ICMP ではなく TCP ping です。接続が拒否されてもホストがオンラインであることは確認できます。無応答の場合のみ損失として扱われます。
      submit: Ping を開始
      summary: "%{sent} 回中 %{received} 回応答、損失 %{loss}%"
      only_refused: ホストは応答していますが、このポートで待ち受けているものはありません。
      no_answer: 応答がありません。ホストがオフラインか、ファイアウォールがパケットを破棄している可能性があります。
      stopped: "%{count} 回連続でタイムアウトしたため停止しました。"
    history:
      dns: "DNS チェック"
      ports: "ポートチェック"
      ping: "TCP ping"
      empty: "まだチェックしていません。"
      note: "履歴はこのブラウザにのみ保存されます。"
      clear: "消去"

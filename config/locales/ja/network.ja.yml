      unresolved_variable: "変数 {{%{name}}} は、選択中の環境で定義されていないか無効になっています。"
      secret_variable: "変数 {{%{name}}} はシークレットのため、ネットワークの対象として使用できません。"
      blocked: "このホストは許可されていません: %{detail}。"
      unresolved: ホスト名を解決できません。
      invalid_type: 対応しているレコードタイプを選択してください。
      blank_ports: ポートを1つ以上入力してください。
      invalid_ports: "「%{token}」は有効なポートではありません。1〜65535の数値、8000-8010 のような範囲、または common を指定してください。"
      too_many_ports: "一度に確認できるポートは最大 %{max} 個です。"
      invalid_port: 1〜65535のポートを入力してください。
      invalid_attempts: "試行回数は1〜%{max}の間で選択してください。"
    statuses:
      ok: 応答あり
      cname: エイリアス
      nodata: レコードなし
      nxdomain: 見つかりません
      servfail: サーバー障害
      refused: 拒否
      timeout: タイムアウト
      error: エラー
      blocked: ブロック
      unresolved: アドレスなし

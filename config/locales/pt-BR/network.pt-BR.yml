          include_missing: "%{name} é referenciado pelo registro, mas não tem um registro SPF válido."
          no_all: "O registro não termina com um termo all, então o e-mail de outros servidores não é coberto. Termine com -all ou ~all."
          pass_all: "O registro termina com +all, o que permite que qualquer servidor envie e-mail como este domínio."
          neutral_all: "O registro termina com ?all, que não dá veredito sobre outros servidores. Use ~all ou -all."
          ptr: "O mecanismo ptr está obsoleto e é lento. Troque por ip4, ip6 ou include."
        dkim:

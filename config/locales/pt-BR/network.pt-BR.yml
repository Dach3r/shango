          lookup_failed: "O resolvedor não conseguiu ler %{name}."
          revoked: "A chave do seletor %{selector} está vazia: foi revogada."
          invalid_key: "A chave do seletor %{selector} não pode ser lida."
          weak_key: "A chave do seletor %{selector} tem apenas %{bits} bits. Use 2048."
          testing: "O seletor %{selector} está em modo de teste (t=y), então os receptores podem ignorar suas assinaturas."
          none_found: "Nenhum dos seletores comuns tem chave DKIM. Digite o seu seletor depois do domínio para verificá-lo."
        dmarc:
          missing: "Não há registro DMARC, então nada diz aos receptores o que fazer com e-mails que falham em SPF e DKIM."
          multiple: "Há mais de um registro DMARC. Os receptores ignoram todos: mantenha um."
          lookup_failed: "O resolvedor não conseguiu ler %{name}."
          invalid_policy: "A política (p) está ausente ou não é none, quarantine nem reject."
          policy_none: "A política é none: as falhas são apenas relatadas. Passe para quarantine ou reject quando os relatórios estiverem limpos."
          weak_subdomain_policy: "Os subdomínios usam %{sp}, mais fraco que o %{p} do domínio."
          partial: "A política é aplicada a apenas %{pct}% dos e-mails com falha."
          no_reports: "Não há endereço rua, então você não recebe relatórios agregados."
        mx:
          missing: "Não há registro MX: o e-mail recorre ao registro A do domínio, ou é rejeitado."
          lookup_failed: "O resolvedor não conseguiu ler %{name}."
          cname: "%{host} é um alias (CNAME), e um MX não pode apontar para um."
          unresolved: "%{host} não resolve para nenhum endereço."
